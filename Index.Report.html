@media(max-width:620px){.rp-top{align-items:flex-start}.rp-title{font-size:22px}.rp-sync-copy{display:none}.rp-filter{grid-template-columns:1fr 1fr}.rp-filter .rp-clear{grid-column:1/-1}.rp-period-filter{grid-template-columns:1fr 1fr}.rp-kpis{grid-template-columns:repeat(2,1fr)}.rp-alert-grid{grid-template-columns:1fr}.rp-period-kpis{grid-template-columns:repeat(2,1fr)}.rp-action-row{grid-template-columns:92px 1fr 16px}.rp-action-row>div:nth-child(3),.rp-action-row>div:nth-child(4){display:none}.rp-tabs{display:flex}.rp-tab{flex:1}.rp-section-head{align-items:flex-start;flex-direction:column}.rp-ranking-row{grid-template-columns:22px minmax(150px,1fr) 48px}.rp-ranking-meter{display:none}.rp-sparse-events{grid-template-columns:1fr}.rp-layout-row{align-items:flex-start;flex-direction:column}.rp-layout-switch{width:100%}.rp-layout-btn{flex:1}.rp-model-best{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.rp-shell,.rp-view,.rp-meter span{animation:none}.rp-kpi,.rp-alert,.rp-refresh,.rp-bar{transition:none}}
</style>

<div class="rp-shell" id="rp-root">
  <div class="rp-top">
    <div><h1 class="rp-title">รายงาน</h1><p class="rp-lead">ติดตามงานค้าง ความต้องการสินค้า และภาพรวมการดำเนินงาน</p></div>
    <div class="rp-sync"><span class="rp-dot loading" id="rp-sync-dot"></span><span class="rp-sync-copy" id="rp-sync-text">กำลังเตรียมข้อมูล…</span><button class="rp-refresh" id="rp-refresh" type="button" aria-label="รีเฟรชข้อมูล" title="รีเฟรชข้อมูล"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5"></path><path d="M4 17v-5h5"></path><path d="M6.1 8.1A7 7 0 0 1 18.8 9M17.9 15.9A7 7 0 0 1 5.2 15"></path></svg></button></div>
  </div>

  <div class="rp-tabs" role="tablist" aria-label="หมวดรายงาน">
    <button class="rp-tab on" data-rp-view="overview" type="button">ภาพรวม</button>
    <button class="rp-tab" data-rp-view="actions" type="button">งานที่ต้องจัดการ</button>
    <button class="rp-tab" data-rp-view="products" type="button">สินค้า</button>
    <button class="rp-tab" data-rp-view="analysis" type="button">วิเคราะห์</button>
  </div>

  <div class="rp-filter">
    <div><label for="rp-group">กลุ่มลูกค้า</label><select id="rp-group"><option value="">ทุกกลุ่ม</option></select></div>
    <div><label for="rp-model">รุ่นสินค้า</label><select id="rp-model"><option value="">ทุกรุ่น</option></select></div>
    <button class="btn2 rp-clear" id="rp-clear" type="button">คืนค่าเริ่มต้น</button>
  </div>

  <div class="rp-period-filter" id="rp-period-filter">
    <div class="field"><label for="rp-start">วันที่เริ่มต้น</label><input id="rp-start" type="date"></div>
    <div class="field"><label for="rp-end">วันที่สิ้นสุด</label><input id="rp-end" type="date"></div>
    <div class="field"><label>ขอบเขตสูงสุด</label><input value="ไม่เกิน 92 วัน" disabled></div>
    <div class="rp-presets"><span style="font-size:10.5px;color:var(--t3);margin-right:2px">ช่วงด่วน</span><button class="rp-preset" data-days="0" type="button">วันนี้</button><button class="rp-preset" data-days="6" type="button">7 วัน</button><button class="rp-preset" data-preset="month" type="button">เดือนนี้</button><button class="rp-preset" data-preset="lastMonth" type="button">เดือนก่อน</button></div>
  </div>

  <div id="rp-content">
    <div class="rp-skeleton-grid"><div class="skel rp-skeleton"></div><div class="skel rp-skeleton"></div><div class="skel rp-skeleton"></div><div class="skel rp-skeleton"></div></div>
  </div>
</div>

<div class="rp-drawer-shade" id="rp-drawer-shade"></div>
<aside class="rp-drawer" id="rp-drawer" aria-hidden="true">
  <div class="rp-drawer-head"><div><h2 id="rp-drawer-title">รายละเอียด</h2><p id="rp-drawer-sub"></p></div><button class="rp-drawer-close" id="rp-drawer-close" type="button" aria-label="ปิด">×</button></div>
  <div class="rp-drawer-list" id="rp-drawer-list"></div>
</aside>
