<html lang="th">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>.ic{display:inline-block;font-style:normal;line-height:1}</style>
<style>
:root{--bg:#fff;--cv:#F4F3F0;--tx:#1A1A19;--t2:#63625D;--t3:#8B8A84;--bd:rgba(0,0,0,.16);--btn:#EDECE7;--btnh:#E3E2DC;--sel:#EEEDFE;--selT:#3C3489;--ink:#262624;--inkT:#fff;--ok:#0F6E56;--okBg:#E1F5EE;--r:12px}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Thai',-apple-system,sans-serif;background:var(--cv);color:var(--tx);font-size:16px}
button{font:inherit;cursor:pointer;font-family:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:0.5px solid var(--bd);padding:calc(11px + env(safe-area-inset-top)) 18px 11px}
.header-inner{max-width:420px;margin:0 auto;display:flex;justify-content:flex-end;align-items:center}
.lang-control{display:inline-flex;align-items:center;gap:8px}
.lang-control svg{width:18px;height:18px;stroke:var(--t2);fill:none;stroke-width:1.8;flex:none;pointer-events:none}
.lang-control select{width:auto;min-width:104px;padding:8px 32px 8px 11px;font:inherit;font-size:13px;border:0.5px solid var(--bd);border-radius:9px;-webkit-appearance:none;appearance:none;background:var(--btn) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23888888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>") no-repeat right 11px center;background-size:13px;color:var(--tx)}
.lang-control select:focus{outline:none;border-color:var(--selT);box-shadow:0 0 0 3px color-mix(in srgb,var(--selT) 18%,transparent)}
main{max-width:420px;margin:0 auto;padding:24px 18px 40px}
.card{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--r);padding:18px}
.pill{font-size:11px;padding:3px 9px;border-radius:8px;background:var(--btn);color:var(--t2);display:inline-block}
.pill.ok{background:var(--okBg);color:var(--ok)}
h1{font-size:16px;font-weight:600;text-align:center;margin:0 0 22px}
input{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:0.5px solid var(--bd);border-radius:9px;background:var(--bg);margin-bottom:8px}
input:disabled{opacity:.5}
.btn{width:100%;background:var(--ink);color:var(--inkT);padding:12px;border-radius:9px;border:none;font-size:15px;margin-top:6px}
.btn:disabled{opacity:.5}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-top:0.5px solid var(--bd);gap:12px}
.kv:first-child{border-top:none}
.kv .k{color:var(--t2)}
.hint{font-size:11.5px;color:var(--t2);margin-top:12px;line-height:1.6}
.loading{text-align:center;color:var(--t2);padding:40px}
.order{font-size:21px;color:var(--tx);letter-spacing:1.4px;font-weight:700;margin:11px 0 18px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.status-note{margin-top:14px;padding:11px 12px;border-radius:9px;background:var(--cv);font-size:12.5px;color:var(--t2);line-height:1.6}
.status-note.warn{background:#FFF1E8;color:#93420A}.status-note.danger{background:#FDEBEC;color:#A61B1B}
.status-note.info{background:#EAF2FF;color:#0C447C}.appointment{color:#0C447C;font-weight:600}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.42);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}
.shake{animation:shake .36s ease-in-out both}.err{color:#B91C1C;font-size:12.5px;margin-top:10px;line-height:1.5}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
</style>
</head>

</div></header>

if(!I18N[LANG])LANG='th';
function t(k){return (I18N[LANG]&&I18N[LANG][k])||I18N.th[k]||k;}
function tt(k,params){var s=t(k);for(var p in (params||{}))s=s.split('{'+p+'}').join(params[p]);return s;}
function applyStatic(){document.documentElement.lang=LANG;$('pageTitle').textContent=t('title');}

var token = new URLSearchParams(window.location.search).get('t') || '';

/* ===== ติดตามจอปัจจุบัน เพื่อ re-render เมื่อเปลี่ยนภาษา ===== */
var VIEW='loading', DATA=null;
function rerender(){
  if(VIEW==='masked'&&DATA)renderMasked(DATA);
  else if(VIEW==='full'&&DATA)renderFull(DATA);
  else if(VIEW==='verify')showVerifyForm();
  else if(VIEW==='badlink')$('box').innerHTML='<div class="loading">'+t('badLink')+'</div>';
  else if(VIEW==='loading')$('box').innerHTML='<div class="loading">'+t('loading')+'</div>';
}

function renderMasked(d){
  VIEW='masked'; DATA=d;
  var h='<div class="order">'+esc(d.id)+'</div>';
  h+='<p style="margin:10px 0 0;font-size:16px;font-weight:600">'+esc(d.maskedName)+'</p>';
  h+='<p style="margin:3px 0 0;font-size:13px;color:var(--t2)">'+esc(d.maskedPhone)+'</p>';
  h+='<p style="margin:12px 0 0;font-size:14px">'+esc(d.model)+'<br>'+esc(d.capacity)+' · '+esc(d.color)+'</p>';
  if(d.price!=null)h+='<p style="margin:8px 0 0;font-size:14px">'+t('price')+' <b style="color:var(--selT)">'+Number(d.price).toLocaleString('th-TH')+'</b> '+t('priceUnit')+'</p>';
  h+='<p class="hint">'+t('maskedHint')+'</p>';
  h+='<button class="btn" id="btnVerify">'+t('verifyBtn')+'</button>';
  h+='<p class="hint" style="margin-top:14px;padding-top:12px;border-top:0.5px solid var(--bd)">'+t('notInfo')+'</p>';
  $('box').innerHTML=h;
  $('btnVerify').onclick=showVerifyForm;
}

var lockTimer=null;
function showVerifyForm(){
  VIEW='verify';
  if(lockTimer){clearInterval(lockTimer);lockTimer=null;}
  $('box').innerHTML='<p style="margin:0 0 8px;font-size:13px;color:var(--t2)">'+t('phonePrompt')+'</p>'+
    '<input id="vphone" type="tel" inputmode="tel" placeholder="0812345678">'+
    '<button class="btn" id="btnGo">'+t('confirm')+'</button>'+
    '<p class="err" id="verr" style="display:none"></p>'+
    '<p class="hint" id="vhint">'+tt('hintRemain',{n:'<b id="vremain">5</b>'})+'</p>';
  $('btnGo').onclick=submitVerify;
  $('vphone').addEventListener('keydown',function(e){if(e.key==='Enter')submitVerify();});
}
function submitVerify(){
  var btn=$('btnGo'); if(btn.disabled) return;
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>'+t('checking');
  call('verifyAndReveal',token,$('vphone').value).then(function(res){
    if(res&&res.ok){renderFull(res.data);return;}
    btn.disabled=false; btn.textContent=t('confirm');
    if(res&&res.locked){startLock(res.lockedSec);return;}
    var v=$('verr'); v.style.display='block'; v.textContent=t('phoneWrong');
    if($('vremain'))$('vremain').textContent=(res&&res.remaining!=null)?res.remaining:'';
    $('box').classList.remove('shake');void $('box').offsetWidth;$('box').classList.add('shake');$('vphone').focus();
  }).catch(function(e){
    btn.disabled=false; btn.textContent=t('confirm');
    var v=$('verr'); v.style.display='block'; v.textContent=(e&&e.message)||t('genericErr');
  });
}
function startLock(sec){
  if(lockTimer){clearInterval(lockTimer);lockTimer=null;}
  var btn=$('btnGo'), input=$('vphone'), err=$('verr'), hint=$('vhint');
  if(btn){btn.disabled=true; btn.textContent=t('confirm');}
  if(input)input.disabled=true;
  if(err){err.style.display='block'; err.textContent=t('lockedMsg');}
  var left=Math.max(1,Number(sec)||180);
  function tick(){
    var m=Math.floor(left/60), s=left%60;
    if(hint)hint.innerHTML=tt('lockCountdown',{t:'<b>'+m+':'+(s<10?'0':'')+s+'</b>'});
    if(left<=0){
      clearInterval(lockTimer);lockTimer=null;
      if(input)input.disabled=false;
      if(btn)btn.disabled=false;
      if(err)err.style.display='none';
      if(hint)hint.innerHTML=tt('hintRemain',{n:'<b id="vremain">5</b>'});
    }
    left--;
  }
  tick(); lockTimer=setInterval(tick,1000);
}

function renderFull(d){
  VIEW='full'; DATA=d;
  var h='<span class="pill ok"><span class="ic">✓</span> '+t('verified')+'</span>';
  h+='<div class="order">'+esc(d.id)+'</div>';
  h+='<p style="margin:10px 0 0;font-size:16px;font-weight:600">'+esc(d.name)+'</p>';
  h+='<p style="margin:3px 0 0;font-size:13px;color:var(--t2)">'+esc(d.phone)+(d.showCustomerGroup&&d.group?' · '+esc(d.group):'')+'</p>';
  h+='<p style="margin:12px 0 0;font-size:14px">'+esc(d.model)+'<br>'+esc(d.capacity)+' · '+esc(d.color)+'</p>';
  h+='<div style="margin-top:12px">';
  if(d.price!=null)h+='<div class="kv"><span class="k">'+t('price')+'</span><span><b style="color:var(--selT)">'+Number(d.price).toLocaleString('th-TH')+'</b> '+t('priceUnit')+'</span></div>';
  if(d.supplierLock)h+='<div class="kv"><span class="k">'+t('condition')+'</span><span>'+t('aisOnly')+(d.promo?' · '+esc(d.promo):'')+'</span></div>';
  if(d.preOrder)h+='<div class="kv"><span class="k">'+t('preOrder')+'</span><span>'+esc(d.preOrder)+'</span></div>';
  if(d.preBooking)h+='<div class="kv"><span class="k">'+t('preBooking')+'</span><span>'+esc(d.preBooking)+'</span></div>';
  if(d.deposit)h+='<div class="kv"><span class="k">'+t('depositBill')+'</span><span>'+tt('depositVal',{no:esc(d.billNo),amt:d.deposit.toLocaleString()})+'</span></div>';
  if(d.dueDate)h+='<div class="kv"><span class="k">'+t('dueDate')+'</span><span>'+esc(d.dueDate)+'</span></div>';
  if(d.appt)h+='<div class="kv appointment"><span>'+t('appt')+'</span><span>'+esc(d.appt)+'</span></div>';
  if(d.additionalNote)h+='<div class="kv"><span class="k">'+t('moreInfo')+'</span><span>'+esc(d.additionalNote)+'</span></div>';
  h+='</div>';
  var updateText='',noteClass='',rem=Math.max(0,Number(d.dueRemainingDays||0));
  if(d.status==='นัดรับแล้ว'&&d.appt){
    if(d.preOrder||d.preBooking){updateText=tt('st_appt_pre',{n:rem});noteClass='info';}
    else if(Number(d.dueRemainingDays)<0){updateText=t('st_appt_over');noteClass='danger';}
    else{updateText=tt('st_appt_ok',{date:esc(d.dueDate),n:rem});noteClass='info';}
  }else if(d.status==='รอสินค้า'){updateText=t('st_wait');}
  else if(d.status==='ของมาแล้ว'){updateText=t('st_arrived');}
  else if(d.status==='รับของแล้ว'){updateText=t('st_done');}
  else{updateText=t('st_generic');}
  h+='<div class="status-note '+noteClass+'"><b style="color:inherit">'+t('statusTitle')+'</b><br>'+updateText+(d.updatedAt?'<br><span style="font-size:11px;color:var(--t3)">'+tt('lastUpdate',{t:esc(d.updatedAt)})+'</span>':'')+'</div>';
  if(d.status==='นัดรับแล้ว'&&d.appt&&Number(d.dueRemainingDays)>=0){h+='<p style="font-size:11.5px;color:var(--t2);line-height:1.65;margin:12px 2px 0"><b>'+t('remarkChangeLabel')+':</b> '+t('remarkChange')+'</p><p style="font-size:11.5px;color:var(--t2);line-height:1.65;margin:8px 2px 0"><b>'+t('remarkOntimeLabel')+':</b> '+t('remarkOntime')+'</p>';}
  h+='<div style="margin-top:12px">';
  if(d.status==='รอสินค้า'&&d.aheadCount!==undefined){
    h+='<div class="kv"><span class="k">'+t('aheadQueue')+'</span><span>'+tt('people',{n:d.aheadCount})+'</span></div>';
    if(d.avgWaitDays)h+='<div class="kv"><span class="k">'+t('avgWait')+'</span><span>'+tt('days',{n:d.avgWaitDays})+'</span></div>';
  }
  h+='</div>';
  $('box').innerHTML=h;
}

/* เปลี่ยนภาษา → บันทึก (แชร์ข้ามหน้า) + re-render จอปัจจุบัน */
$('langSel').value=LANG;
$('langSel').onchange=function(){
  LANG=$('langSel').value;
  try{localStorage.setItem('iphoneQueueWelcomeLang',LANG);}catch(e){}
  applyStatic(); rerender();
};

applyStatic();
if(!token){VIEW='badlink';$('box').innerHTML='<div class="loading">'+t('badLink')+'</div>';}
else{VIEW='loading';$('box').innerHTML='<div class="loading">'+t('loading')+'</div>';call('checkByToken',token).then(renderMasked).catch(function(e){$('box').innerHTML='<div class="loading">'+esc(e.message)+'</div>';});}
</script>
</body>
</html>
