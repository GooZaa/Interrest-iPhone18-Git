<script>
(function(){
'use strict';
var RP={bound:false,loaded:false,loading:false,data:null,seq:0,timer:null,refreshTimer:null,view:'overview',action:'overdue',productMode:'demand',productLayout:'models',pendingFilter:null};
var RP_FILTER_KEY='queue_report_filter_v1',RP_VIEW_KEY='queue_report_view_v1',RP_PRODUCT_KEY='queue_report_product_mode_v1',RP_PRODUCT_LAYOUT_KEY='queue_report_product_layout_v1';
var ACTION_META={
  overdue:{label:'เลยกำหนด',hint:'เลยวันนัดหรือวันครบกำหนด',tone:'red',mark:'!'},
  today:{label:'นัดรับวันนี้',hint:'รายการที่มีนัดหมายวันนี้',tone:'amber',mark:'•'},
  noCall:{label:'ยังไม่เคยโทร',hint:'ของมาแล้วและยังไม่มีบันทึกการโทร',tone:'blue',mark:'☎'},
  waitLong:{label:'รอสินค้านาน',hint:'เกินเกณฑ์วันรอนานของระบบ',tone:'amber',mark:'⌛'},
  manyFails:{label:'ติดต่อหลายครั้ง',hint:'จำนวนครั้งโทรถึงเกณฑ์แจ้งเตือน',tone:'violet',mark:'↻'},
  quality:{label:'ข้อมูลที่ต้องตรวจสอบ',hint:'ข้อมูลไม่ครบหรือสถานะไม่สัมพันธ์กัน',tone:'red',mark:'◇'}
};
function rpEl(id){return document.getElementById(id);}
function rpEsc(value){return esc(value==null?'':value);}
function rpNum(value){return Number(value||0).toLocaleString('th-TH');}
function rpDateKey(date){var y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return y+'-'+m+'-'+d;}
function rpMonthRange(offset){var now=new Date(),first=new Date(now.getFullYear(),now.getMonth()+(offset||0),1),last=offset===-1?new Date(now.getFullYear(),now.getMonth(),0):now;return {start:rpDateKey(first),end:rpDateKey(last)};}
function rpDefaultFilter(){var range=rpMonthRange(0);return {group:'',model:'',start:range.start,end:range.end};}
function rpReadFilter(){var base=rpDefaultFilter();try{var saved=JSON.parse(localStorage.getItem(RP_FILTER_KEY)||'{}');Object.keys(base).forEach(function(k){if(saved[k]!=null)base[k]=String(saved[k]);});}catch(e){}return base;}
function rpFilter(){var pending=RP.pendingFilter;return {group:pending?pending.group:rpEl('rp-group').value,model:pending?pending.model:rpEl('rp-model').value,start:rpEl('rp-start').value,end:rpEl('rp-end').value};}
function rpApplyFilter(filter){filter=filter||rpDefaultFilter();RP.pendingFilter={group:filter.group||'',model:filter.model||''};rpEl('rp-start').value=filter.start||'';rpEl('rp-end').value=filter.end||'';}
function rpSaveFilter(){try{localStorage.setItem(RP_FILTER_KEY,JSON.stringify(rpFilter()));}catch(e){}}
function rpSetSync(mode,text){var dot=rpEl('rp-sync-dot'),copy=rpEl('rp-sync-text');dot.className='rp-dot'+(mode==='loading'?' loading':mode==='error'?' error':'');copy.textContent=text||'';}
function rpSkeleton(){rpEl('rp-content').innerHTML='<div class="rp-skeleton-grid"><div class="skel rp-skeleton"></div><div class="skel rp-skeleton"></div><div class="skel rp-skeleton"></div><div class="skel rp-skeleton"></div></div>';}
function rpError(message){rpEl('rp-content').innerHTML='<div class="rp-error"><b>โหลดรายงานไม่สำเร็จ</b><span>'+rpEsc(message||'กรุณาลองใหม่อีกครั้ง')+'</span><button class="btn2" id="rp-error-retry" type="button">ลองใหม่</button></div>';rpEl('rp-error-retry').onclick=function(){rpLoad(true);};}
function rpOptions(select,items,first,current){select.innerHTML='<option value="">'+rpEsc(first)+'</option>'+items.map(function(x){return '<option value="'+rpEsc(x)+'">'+rpEsc(x)+'</option>';}).join('');select.value=items.indexOf(current)>-1?current:'';}
function rpKpi(status,label,tone,hint,count){return '<button class="rp-kpi" data-tone="'+tone+'" data-rp-detail="status|'+rpEsc(status)+'" type="button"><span class="rp-kpi-v">'+rpNum(count)+'</span><span class="rp-kpi-k">'+rpEsc(label)+'</span><span class="rp-kpi-s">'+rpEsc(hint)+'</span></button>';}
function rpAlert(key,count){var m=ACTION_META[key];return '<button class="rp-alert" data-tone="'+m.tone+'" data-rp-detail="action|'+key+'" type="button"><span class="rp-alert-mark">'+m.mark+'</span><span class="rp-alert-copy"><b>'+m.label+'</b><small>'+m.hint+'</small></span><span class="rp-alert-count">'+rpNum(count)+'</span></button>';}
function rpTrendGroups(points){
  if(points.length<=14)return {label:'รายวัน',items:points.map(function(p){return {label:p.date.slice(8,10)+'/'+p.date.slice(5,7),title:p.date.slice(8,10)+'/'+p.date.slice(5,7)+'/'+p.date.slice(0,4),created:Number(p.created)||0,done:Number(p.done)||0};})};
  if(points.length<=60){var weeks=[];for(var i=0;i<points.length;i+=7){var part=points.slice(i,i+7),first=part[0].date,last=part[part.length-1].date;weeks.push({label:first.slice(8,10)+'–'+last.slice(8,10)+'/'+last.slice(5,7),title:first.slice(8,10)+'/'+first.slice(5,7)+' ถึง '+last.slice(8,10)+'/'+last.slice(5,7),created:part.reduce(function(n,x){return n+(Number(x.created)||0);},0),done:part.reduce(function(n,x){return n+(Number(x.done)||0);},0)});}return {label:'รายสัปดาห์',items:weeks};}
  var map={},order=[];points.forEach(function(p){var key=p.date.slice(0,7);if(!map[key]){map[key]={label:p.date.slice(5,7)+'/'+p.date.slice(2,4),title:'เดือน '+p.date.slice(5,7)+'/'+p.date.slice(0,4),created:0,done:0};order.push(key);}map[key].created+=Number(p.created)||0;map[key].done+=Number(p.done)||0;});return {label:'รายเดือน',items:order.map(function(k){return map[k];})};
}
function rpSparseChart(points,totalCreated,totalDone){var active=points.filter(function(p){return Number(p.created)||Number(p.done);});return '<div class="rp-chart-summary"><span>ข้อมูลมีเพียง <strong>'+active.length+' วันที่มีกิจกรรม</strong> จึงแสดงแบบสรุปแทนกราฟ</span><span>รวมคิวใหม่ <strong>'+rpNum(totalCreated)+'</strong> · รับของแล้ว <strong>'+rpNum(totalDone)+'</strong></span></div><div class="rp-sparse-events">'+active.map(function(p){var date=p.date.slice(8,10)+'/'+p.date.slice(5,7),year=p.date.slice(0,4);return '<div class="rp-sparse-event"><span class="rp-sparse-date">'+date+'<br>'+year+'</span><div class="rp-sparse-values"><div class="created"><b>'+rpNum(p.created)+'</b><span>คิวใหม่</span></div><div class="done"><b>'+rpNum(p.done)+'</b><span>รับของแล้ว</span></div></div></div>';}).join('')+'</div><div class="rp-legend"><span><i></i>คิวใหม่ (วันที่สร้างคิว)</span><span><i class="done"></i>รับของแล้ว (วันที่อัปเดตล่าสุด)</span></div>';}
function rpChart(points){
  points=points||[];if(!points.length)return '<div class="rp-empty"><b>ยังไม่มีข้อมูลกราฟ</b><span>ลองเปลี่ยนช่วงเวลาวิเคราะห์</span></div>';
  var rawMax=0,totalCreated=0,totalDone=0;points.forEach(function(p){var created=Number(p.created)||0,done=Number(p.done)||0;rawMax=Math.max(rawMax,created,done);totalCreated+=created;totalDone+=done;});
  if(!rawMax)return '<div class="rp-chart-summary"><span>หน่วย: <strong>รายการต่อวัน</strong></span><span>คิวใหม่ 0 · รับของแล้ว 0</span></div>'+rpEmpty('ไม่มีความเคลื่อนไหวในช่วงเวลานี้','ยังไม่มีคิวใหม่หรือรายการรับของแล้ว');
  if(points.filter(function(p){return Number(p.created)||Number(p.done);}).length<=2)return rpSparseChart(points,totalCreated,totalDone);
  var grouped=rpTrendGroups(points),items=grouped.items;rawMax=1;items.forEach(function(p){rawMax=Math.max(rawMax,p.created,p.done);});var axisMax=rawMax<=5?rawMax:Math.ceil(rawMax/5)*5,mid=Math.round(axisMax/2*10)/10;
  var bars=items.map(function(p){var title=p.title+' · คิวใหม่ '+p.created+' · รับของแล้ว '+p.done;return '<div class="rp-bar-day" title="'+rpEsc(title)+'"><div class="rp-bars"><span class="rp-bar-cell"><b class="rp-bar-value">'+(p.created?rpNum(p.created):'')+'</b><i class="rp-bar" style="height:'+(p.created?Math.max(5,p.created/axisMax*100):0)+'%"></i></span><span class="rp-bar-cell"><b class="rp-bar-value">'+(p.done?rpNum(p.done):'')+'</b><i class="rp-bar done" style="height:'+(p.done?Math.max(5,p.done/axisMax*100):0)+'%"></i></span></div><span class="rp-date-label">'+rpEsc(p.label)+'</span></div>';}).join('');
  var width=Math.max(510,items.length*78);
  return '<div class="rp-chart-summary"><span>แสดงแบบ <strong>'+grouped.label+'</strong> · หน่วย: จำนวนรายการ</span><span>รวมคิวใหม่ <strong>'+rpNum(totalCreated)+'</strong> · รับของแล้ว <strong>'+rpNum(totalDone)+'</strong></span></div><div class="rp-chart-layout"><div class="rp-y-axis"><span>'+rpNum(axisMax)+'</span><span>'+rpNum(mid)+'</span><span>0</span></div><div class="rp-chart-scroll"><div class="rp-chart" style="min-width:'+width+'px">'+bars+'</div></div></div><div class="rp-legend"><span><i></i>คิวใหม่ (วันที่สร้างคิว)</span><span><i class="done"></i>รับของแล้ว (วันที่อัปเดตล่าสุด)</span></div>';
}
function rpMiniProducts(products){
  var list=(products||[]).slice(0,5),max=list.reduce(function(n,x){return Math.max(n,x.waiting);},1);
  if(!list.length)return '<div class="rp-empty"><b>ยังไม่มีข้อมูลสินค้า</b><span>ไม่พบรายการตามตัวกรอง</span></div>';
  return '<div class="rp-top-products">'+list.map(function(x){return '<div class="rp-product-mini" data-rp-model="'+rpEsc(x.model)+'"><div class="rp-product-mini-head"><b>'+rpEsc(x.model)+' · '+rpEsc(x.capacity)+'</b><span>รอ '+rpNum(x.waiting)+'</span></div><div class="rp-meter"><span style="width:'+Math.max(4,x.waiting/max*100)+'%"></span></div></div>';}).join('')+'</div>';
}
function rpEmpty(title,sub){return '<div class="rp-empty"><b>'+rpEsc(title)+'</b><span>'+rpEsc(sub)+'</span></div>';}
function rpActionRows(items){
  if(!items||!items.length)return rpEmpty('ไม่มีรายการในหมวดนี้','ข้อมูลปัจจุบันอยู่ในเกณฑ์ปกติ');
  return items.slice(0,100).map(function(x){return '<div class="rp-action-row" data-rp-open="'+rpEsc(x.id)+'"><div><span class="rp-action-id">'+rpEsc(x.id)+'</span></div><div><div class="rp-action-name">'+rpEsc(x.name)+'</div><div class="rp-action-sub">'+rpEsc(x.group)+' · '+rpEsc(x.model)+'</div></div><div class="rp-action-reason"><span class="rp-severity '+rpEsc(x.severity)+'"></span>'+rpEsc(x.reason||x.status)+'</div><div class="rp-action-sub">'+rpEsc(x.appt||x.dueDate||('รอ '+x.waitDays+' วัน'))+'</div><div>›</div></div>';}).join('');
}
function rpActionView(data){
  var tabs=Object.keys(ACTION_META).map(function(key){var count=(data.actions[key]||[]).length,m=ACTION_META[key];return '<button class="rp-action-tab'+(RP.action===key?' on':'')+'" data-rp-action="'+key+'" type="button">'+m.label+' · '+rpNum(count)+'</button>';}).join('');
  return '<div class="rp-section-head"><div><h2>งานที่ต้องจัดการ</h2><p>เรียงจากรายการเร่งด่วนและรายการที่รอนานก่อน</p></div><span class="rp-section-meta">ข้อมูลสถานะปัจจุบัน</span></div><div class="rp-action-tabs">'+tabs+'</div><div class="rp-action-list">'+rpActionRows(data.actions[RP.action]||[])+'</div>';
}
var PRODUCT_MODE={demand:{label:'ลูกค้าต้องการมากที่สุด',short:'ความต้องการ',unit:'รายการ'},sold:{label:'ขายดีที่สุด',short:'รับของแล้ว',unit:'รายการ'},backlog:{label:'ค้างรอมากที่สุด',short:'ค้างรอ',unit:'รายการ'},successRate:{label:'อัตราปิดงานสูงสุด',short:'อัตราปิดงาน',unit:'%'}};
function rpProductMetricText(item,mode){if(!item)return '—';return mode==='successRate'?(item.successRate==null?'—':rpNum(item.successRate)+'%'):rpNum(item[mode]);}
function rpProductRankCard(title,item,mode){var value=item?(item.value||item.label):'ยังไม่มีข้อมูล',note=mode==='successRate'&&item?'จาก '+rpNum(item.closed)+' รายการที่ปิด':'อันดับสูงสุดตามตัวกรอง';return '<div class="rp-rank-card"><span class="rp-rank-label">'+rpEsc(title)+'</span><span class="rp-rank-value">'+rpEsc(value)+'</span><span class="rp-rank-count">'+rpProductMetricText(item,mode)+'</span><span class="rp-rank-note">'+rpEsc(note)+'</span></div>';}
function rpSortProductSpecs(specs,mode){return (specs||[]).slice().sort(function(a,b){var av=mode==='successRate'?(a.successRate==null?-1:a.successRate):Number(a[mode])||0,bv=mode==='successRate'?(b.successRate==null?-1:b.successRate):Number(b[mode])||0;if(bv!==av)return bv-av;if((b.closed||0)!==(a.closed||0))return (b.closed||0)-(a.closed||0);return String(a.label).localeCompare(String(b.label));});}
function rpProductRanking(rows,mode){var active=rows.filter(function(x){return mode==='successRate'?x.closed>0:Number(x[mode])>0;}).slice(0,8);if(!active.length)return rpEmpty('ยังไม่มีข้อมูลจัดอันดับ','ลองเปลี่ยนช่วงเวลาหรือตัวกรองสินค้า');var max=mode==='successRate'?Math.max.apply(Math,active.map(function(x){return Number(x.successRate)||0;})):Math.max.apply(Math,active.map(function(x){return Number(x[mode])||0;}));return '<div class="rp-ranking-list">'+active.map(function(x,i){var value=mode==='successRate'?Number(x.successRate)||0:Number(x[mode])||0,width=max?value/max*100:0;return '<div class="rp-ranking-row"><span class="rp-ranking-no">'+(i+1)+'</span><span class="rp-ranking-name" title="'+rpEsc(x.label)+'">'+rpEsc(x.label)+'</span><span class="rp-ranking-meter"><span style="width:'+Math.max(3,width)+'%"></span></span><span class="rp-ranking-value">'+rpProductMetricText(x,mode)+'</span></div>';}).join('')+'</div>';}
function rpAggregateProductSpecs(specs){var out={demand:0,sold:0,backlog:0,allocated:0,cancelled:0,closed:0,successRate:null};(specs||[]).forEach(function(x){['demand','sold','backlog','allocated','cancelled'].forEach(function(k){out[k]+=Number(x[k])||0;});});out.closed=out.sold+out.cancelled;out.successRate=out.closed?Math.round(out.sold*1000/out.closed)/10:null;return out;}
function rpProductMetricValue(item,mode){return mode==='successRate'?(item&&item.successRate!=null?Number(item.successRate):-1):Number(item&&item[mode])||0;}
function rpGroupProductSpecs(specs,field,mode){var map={};(specs||[]).forEach(function(x){var key=x[field]||'ไม่ระบุ';if(!map[key])map[key]=[];map[key].push(x);});return Object.keys(map).map(function(key){var item=rpAggregateProductSpecs(map[key]);item.value=key;item.label=key;return item;}).sort(function(a,b){var diff=rpProductMetricValue(b,mode)-rpProductMetricValue(a,mode);if(diff)return diff;if(b.closed!==a.closed)return b.closed-a.closed;return String(a.value).localeCompare(String(b.value));});}
function rpActiveProductRows(rows,mode){return (rows||[]).filter(function(x){return mode==='successRate'?x.closed>0:Number(x[mode])>0;});}
function rpModelProductCards(specs,mode){
  var groups={};(specs||[]).forEach(function(x){var model=x.model||'ไม่ระบุรุ่น';if(!groups[model])groups[model]=[];groups[model].push(x);});
  var models=Object.keys(groups).map(function(model){var items=groups[model],total=rpAggregateProductSpecs(items);return {model:model,items:items,total:total};}).filter(function(x){return mode==='successRate'?x.total.closed>0:Number(x.total[mode])>0;}).sort(function(a,b){var diff=rpProductMetricValue(b.total,mode)-rpProductMetricValue(a.total,mode);if(diff)return diff;if(b.total.closed!==a.total.closed)return b.total.closed-a.total.closed;return a.model.localeCompare(b.model);});
  if(!models.length)return rpEmpty('ยังไม่มีข้อมูลแยกตามรุ่น','ลองเปลี่ยนช่วงเวลา มุมมอง หรือตัวกรองสินค้า');
  return '<div class="rp-model-grid">'+models.map(function(group){
    var capacities=rpGroupProductSpecs(group.items,'capacity',mode),colors=rpGroupProductSpecs(group.items,'color',mode),rows=rpActiveProductRows(rpSortProductSpecs(group.items,mode),mode).slice(0,4),max=rows.reduce(function(n,x){return Math.max(n,Math.max(0,rpProductMetricValue(x,mode)));},0),cap=capacities[0],color=colors[0];
    var list=rows.length?rows.map(function(x,i){var value=Math.max(0,rpProductMetricValue(x,mode)),width=max?value/max*100:0;return '<div class="rp-model-spec"><span class="rp-model-spec-no">'+(i+1)+'</span><span class="rp-model-spec-copy"><b>'+rpEsc(x.capacity)+' · '+rpEsc(x.color)+'</b><span class="rp-ranking-meter"><span style="width:'+Math.max(3,width)+'%"></span></span></span><span class="rp-model-spec-value">'+rpProductMetricText(x,mode)+'</span></div>';}).join(''):'<span class="rp-model-more">ยังไม่มีข้อมูลสเปก</span>';
    return '<article class="rp-model-card"><div class="rp-model-head"><div><h3>'+rpEsc(group.model)+'</h3><p>'+rpNum(group.items.length)+' รูปแบบสินค้า</p></div><div class="rp-model-total"><b>'+rpProductMetricText(group.total,mode)+'</b><span>'+rpEsc(PRODUCT_MODE[mode].short)+'</span></div></div><div class="rp-model-best"><div><small>ความจุอันดับ 1</small><b title="'+rpEsc(cap?cap.value:'ยังไม่มีข้อมูล')+'">'+rpEsc(cap?cap.value:'ยังไม่มีข้อมูล')+'</b><small>'+(cap?rpProductMetricText(cap,mode):'—')+'</small></div><div><small>สีอันดับ 1</small><b title="'+rpEsc(color?color.value:'ยังไม่มีข้อมูล')+'">'+rpEsc(color?color.value:'ยังไม่มีข้อมูล')+'</b><small>'+(color?rpProductMetricText(color,mode):'—')+'</small></div></div><div class="rp-model-list">'+list+'</div>'+(group.items.length>4?'<div class="rp-model-more">แสดง 4 อันดับแรกจาก '+rpNum(group.items.length)+' สเปก</div>':'')+'</article>';
  }).join('')+'</div>';
}
function rpProductView(data){
  var analytics=data.productAnalytics||{specs:[],rankings:{}},mode=RP.productMode,meta=PRODUCT_MODE[mode],rows=rpSortProductSpecs(analytics.specs,mode),rank=(analytics.rankings||{})[mode]||{};
  var modes=Object.keys(PRODUCT_MODE).map(function(key){return '<button class="rp-product-mode'+(mode===key?' on':'')+'" data-rp-product-mode="'+key+'" type="button">'+PRODUCT_MODE[key].label+'</button>';}).join('');
  var layouts='<div class="rp-layout-row"><b>รูปแบบการเปรียบเทียบ</b><div class="rp-layout-switch"><button class="rp-layout-btn'+(RP.productLayout==='models'?' on':'')+'" data-rp-product-layout="models" type="button">แยกตามรุ่น</button><button class="rp-layout-btn'+(RP.productLayout==='all'?' on':'')+'" data-rp-product-layout="all" type="button">รวมทุกสเปก</button></div></div>';
  var modelView='<div class="rp-product-guide"><b>วิธีอ่าน:</b> แต่ละการ์ดคือหนึ่งรุ่น ตัวเลขใหญ่คือผลรวมของรุ่นนั้น และด้านล่างแสดงความจุ สี และสเปกที่เด่นที่สุดภายในรุ่นเดียวกัน · มุมมองค้างรอและจัดสรรแล้วเป็นสถานะปัจจุบัน จึงไม่จำกัดด้วยช่วงวันที่</div>'+rpModelProductCards(analytics.specs,mode);
  var cards=rpProductRankCard('รุ่นอันดับ 1',rank.model,mode)+rpProductRankCard('ความจุอันดับ 1',rank.capacity,mode)+rpProductRankCard('สีอันดับ 1',rank.color,mode)+rpProductRankCard('สเปกอันดับ 1',rank.spec,mode);
  var body=rows.length?rows.map(function(x,i){var rate=x.successRate==null?'—':rpNum(x.successRate)+'%';return '<div class="rp-analytics-row"><span class="rp-rank-no">'+(i+1)+'</span><span class="rp-spec-name"><b>'+rpEsc(x.model)+'</b><small>'+rpEsc(x.capacity)+' · '+rpEsc(x.color)+'</small></span><span class="rp-num'+(mode==='demand'?' strong':'')+'">'+rpNum(x.demand)+'</span><span class="rp-num'+(mode==='sold'?' strong':'')+'">'+rpNum(x.sold)+'</span><span class="rp-num'+(mode==='backlog'?' strong':'')+'">'+rpNum(x.backlog)+'</span><span class="rp-num">'+rpNum(x.allocated)+'</span><span class="rp-num">'+rpNum(x.cancelled)+'</span><span class="rp-num'+(mode==='successRate'?' strong':'')+'">'+rate+'</span></div>';}).join(''):rpEmpty('ไม่พบข้อมูลสินค้า','ลองเปลี่ยนช่วงเวลาหรือยกเลิกตัวกรองบางรายการ');
  var allView='<div class="rp-product-guide"><b>วิธีอ่าน:</b> ความต้องการนับจากวันที่สร้างคิวในช่วงที่เลือก · ขายสำเร็จและยกเลิกนับจากวันที่อัปเดตล่าสุด · ค้างรอและจัดสรรแล้วเป็นสถานะปัจจุบัน</div><div class="rp-rank-grid">'+cards+'</div><div class="rp-card"><div class="rp-card-title"><b>8 สเปกอันดับสูงสุด · '+rpEsc(meta.label)+'</b><span>ตัวเลขแสดงท้ายแถบ</span></div>'+rpProductRanking(rows,mode)+'</div><div class="rp-section-head"><div><h2>รายละเอียดทุกสเปก</h2><p>ตารางจะเรียงใหม่ตามมุมมองที่เลือก</p></div><span class="rp-section-meta">'+rpNum(rows.length)+' สเปก</span></div><div class="rp-table rp-table-scroll"><div class="rp-analytics-table"><div class="rp-analytics-head"><span>อันดับ</span><span>รุ่น / ความจุ / สี</span><span>ต้องการ</span><span>รับแล้ว</span><span>ค้างรอ</span><span>จัดสรรแล้ว</span><span>ยกเลิก</span><span>อัตราปิด</span></div>'+body+'</div></div>';
  return '<div class="rp-section-head"><div><h2>วิเคราะห์รุ่น ความจุ และสี</h2><p>เปรียบเทียบภายในแต่ละรุ่นได้โดยไม่ให้สีและความจุของคนละรุ่นปะปนกัน</p></div><span class="rp-section-meta">เรียงตาม '+rpEsc(meta.short)+'</span></div><div class="rp-product-modes">'+modes+'</div>'+layouts+(RP.productLayout==='models'?modelView:allView);
}
function rpAnalysisView(data){var p=data.period,rate=p.successRate==null?'—':p.successRate+'%',avg=p.avgWaitDays==null?'—':p.avgWaitDays+' วัน',avgHint=!p.waitSampleSize?'ไม่มีรายการของเข้าในช่วงนี้':(p.avgWaitDays===0?'เฉลี่ยภายในวันเดียวกัน · '+rpNum(p.waitSampleSize)+' ตัวอย่าง':'จาก '+rpNum(p.waitSampleSize)+' ตัวอย่าง');return '<div class="rp-section-head"><div><h2>ผลงานตามช่วงเวลา</h2><p>คิวใหม่อ้างอิงวันที่สร้าง · รายการปิดอ้างอิงวันที่อัปเดตล่าสุด · เวลารออ้างอิงวันที่บันทึกของเข้า</p></div><span class="rp-section-meta">'+rpEsc(data.appliedFilter.start)+' ถึง '+rpEsc(data.appliedFilter.end)+'</span></div><div class="rp-period-kpis"><div class="rp-metric"><b>'+rpNum(p.newCount)+'</b><span>คิวใหม่</span><small>สร้างในช่วงเวลานี้</small></div><div class="rp-metric"><b>'+rpNum(p.doneCount)+'</b><span>รับของแล้ว</span><small>อัปเดตเป็นปิดสำเร็จ</small></div><div class="rp-metric"><b>'+rpNum(p.cancelCount)+'</b><span>ยกเลิก</span><small>อัปเดตเป็นยกเลิก</small></div><div class="rp-metric"><b>'+rate+'</b><span>อัตราปิดสำเร็จ</span><small>รับแล้ว ÷ รายการที่ปิด</small></div><div class="rp-metric"><b>'+avg+'</b><span>เวลารอเฉลี่ย</span><small>'+avgHint+'</small></div></div><div class="rp-card"><div class="rp-card-title"><b>จำนวนคิวใหม่และรับของแล้ว ตามช่วงเวลา</b><span>ระบบสรุปเป็นรายวัน รายสัปดาห์ หรือรายเดือนตามช่วงที่เลือก</span></div>'+rpChart(p.trend)+'</div>';
}
function rpOverview(data){
  var s=data.current.statuses,a=data.actions,p=data.period;
  var kpis=rpKpi('รอตรวจสอบ','รอตรวจสอบ','neutral','รอยืนยันเข้าคิว',s['รอตรวจสอบ'])+rpKpi('รอสินค้า','รอสินค้า','violet','ความต้องการคงค้าง',s['รอสินค้า'])+rpKpi('ของมาแล้ว','ของมาแล้ว','green','ควรติดต่อลูกค้า',s['ของมาแล้ว'])+rpKpi('นัดรับแล้ว','นัดรับแล้ว','amber','มีวันนัดรับสินค้า',s['นัดรับแล้ว'])+rpKpi('รับของแล้ว','รับของแล้ว','blue','ปิดรายการสำเร็จ',s['รับของแล้ว'])+rpKpi('ยกเลิก','ยกเลิก','red','รายการที่ปิดแล้ว',s['ยกเลิก']);
  var alerts=rpAlert('overdue',a.overdue.length)+rpAlert('today',a.today.length)+rpAlert('noCall',a.noCall.length)+rpAlert('waitLong',a.waitLong.length)+rpAlert('manyFails',a.manyFails.length)+rpAlert('quality',a.quality.length);
  var unknown=data.current.unknownStatuses?'<div class="rp-product-guide"><b>ควรตรวจสอบ:</b> พบสถานะที่ระบบไม่รู้จัก '+rpNum(data.current.unknownStatuses)+' รายการ ดูรายละเอียดได้ที่ “ข้อมูลที่ต้องตรวจสอบ”</div>':'';
  return '<div class="rp-section-head"><div><h2>สถานะปัจจุบัน</h2><p>ไม่จำกัดด้วยช่วงวันที่ เพื่อไม่ให้คิวเก่าหายจากภาพรวม</p></div><span class="rp-section-meta">ทั้งหมด '+rpNum(data.current.total)+' รายการ</span></div><div class="rp-kpis">'+kpis+'</div>'+unknown+'<div class="rp-section-head"><div><h2>ต้องดำเนินการ</h2><p>รายการสำคัญที่ควรตรวจสอบก่อน</p></div></div><div class="rp-alert-grid">'+alerts+'</div><div class="rp-section-head"><div><h2>ผลงานในช่วงเวลา</h2><p>คิวใหม่ '+rpNum(p.newCount)+' · รับของแล้ว '+rpNum(p.doneCount)+'</p></div></div><div class="rp-split"><div class="rp-card"><div class="rp-card-title"><b>จำนวนคิวใหม่และรับของแล้ว ตามช่วงเวลา</b><span>ระบบสรุปช่วงเวลาให้อัตโนมัติ</span></div>'+rpChart(p.trend)+'</div><div class="rp-card"><div class="rp-card-title"><b>สินค้าที่มีคิวรอสูง</b><span>กดเพื่อกรองตามรุ่น</span></div>'+rpMiniProducts(data.products)+'</div></div>';
}
function rpRender(){
  var d=RP.data;if(!d)return;
  rpEl('rp-content').innerHTML='<section class="rp-view'+(RP.view==='overview'?' on':'')+'" data-rp-section="overview">'+rpOverview(d)+'</section><section class="rp-view'+(RP.view==='actions'?' on':'')+'" data-rp-section="actions">'+rpActionView(d)+'</section><section class="rp-view'+(RP.view==='products'?' on':'')+'" data-rp-section="products">'+rpProductView(d)+'</section><section class="rp-view'+(RP.view==='analysis'?' on':'')+'" data-rp-section="analysis">'+rpAnalysisView(d)+'</section>';
  document.querySelectorAll('.rp-tab').forEach(function(x){x.classList.toggle('on',x.dataset.rpView===RP.view);});
  rpBindDynamic();
}
function rpBindDynamic(){
  document.querySelectorAll('[data-rp-detail]').forEach(function(el){el.onclick=function(){var p=el.dataset.rpDetail.split('|');rpOpenDrawer(p[0],p.slice(1).join('|'));};});
  document.querySelectorAll('[data-rp-open]').forEach(function(el){el.onclick=function(){rpCloseDrawer();if(typeof openDetail==='function')openDetail(el.dataset.rpOpen);};});
  document.querySelectorAll('[data-rp-action]').forEach(function(el){el.onclick=function(){RP.action=el.dataset.rpAction;rpRender();};});
  document.querySelectorAll('[data-rp-product-mode]').forEach(function(el){el.onclick=function(){RP.productMode=el.dataset.rpProductMode;try{localStorage.setItem(RP_PRODUCT_KEY,RP.productMode);}catch(e){}rpRender();};});
  document.querySelectorAll('[data-rp-product-layout]').forEach(function(el){el.onclick=function(){RP.productLayout=el.dataset.rpProductLayout;try{localStorage.setItem(RP_PRODUCT_LAYOUT_KEY,RP.productLayout);}catch(e){}rpRender();};});
  document.querySelectorAll('[data-rp-model]').forEach(function(el){el.onclick=function(){rpEl('rp-model').value=el.dataset.rpModel;rpSchedule();};});
}
function rpOpenDrawer(kind,value){
  var drawer=rpEl('rp-drawer'),shade=rpEl('rp-drawer-shade'),list=rpEl('rp-drawer-list');
  drawer.classList.add('on');shade.classList.add('on');drawer.setAttribute('aria-hidden','false');rpEl('rp-drawer-title').textContent='กำลังโหลด…';rpEl('rp-drawer-sub').textContent='';list.innerHTML=loadingHtml('กำลังเตรียมรายชื่อ…');
  callApi('reportGetDetails',{kind:kind,value:value,filter:rpFilter()}).then(function(result){
    rpEl('rp-drawer-title').textContent=result.title;rpEl('rp-drawer-sub').textContent=result.total+' รายการ'+(result.limited?' · แสดง 100 รายการแรก':'');
    list.innerHTML=result.items.length?result.items.map(function(x){return '<div class="rp-drawer-item" data-rp-open="'+rpEsc(x.id)+'"><div><span class="rp-action-id">'+rpEsc(x.id)+'</span><b>'+rpEsc(x.name)+'</b><small>'+rpEsc(x.group)+' · '+rpEsc(x.model)+' '+rpEsc(x.capacity)+'</small><small>'+rpEsc(x.reason||x.status)+(x.appt?' · '+rpEsc(x.appt):'')+'</small></div><span>›</span></div>';}).join(''):rpEmpty('ไม่มีรายการ','ไม่พบข้อมูลตามเงื่อนไขปัจจุบัน');
    rpBindDynamic();
  }).catch(function(e){list.innerHTML='<div class="rp-error"><b>โหลดรายชื่อไม่สำเร็จ</b><span>'+rpEsc(e.message)+'</span></div>';});
}
function rpCloseDrawer(){rpEl('rp-drawer').classList.remove('on');rpEl('rp-drawer-shade').classList.remove('on');rpEl('rp-drawer').setAttribute('aria-hidden','true');}
function rpLoad(force){
  var current=++RP.seq;RP.loading=true;rpSetSync('loading',RP.data?'กำลังตรวจสอบข้อมูลใหม่…':'กำลังโหลดรายงาน…');if(!RP.data)rpSkeleton();rpSaveFilter();
  callApi('reportGetDashboard',rpFilter(),!!force).then(function(data){if(current!==RP.seq)return;RP.loading=false;RP.loaded=true;RP.data=data;var f=data.appliedFilter;RP.pendingFilter=null;rpOptions(rpEl('rp-group'),data.options.groups,'ทุกกลุ่ม',f.group);rpOptions(rpEl('rp-model'),data.options.models,'ทุกรุ่น',f.model);rpEl('rp-start').value=f.start;rpEl('rp-end').value=f.end;rpSaveFilter();rpSetSync('ok','อัปเดตล่าสุด '+data.generatedAt);rpRender();}).catch(function(e){if(current!==RP.seq)return;RP.loading=false;rpSetSync('error','เชื่อมต่อรายงานไม่สำเร็จ');if(!RP.data)rpError(e.message);else toast('รีเฟรชรายงานไม่สำเร็จ: '+e.message);});
}
function rpSchedule(){clearTimeout(RP.timer);RP.timer=setTimeout(function(){rpLoad(false);},300);}
function rpSetPreset(el){var now=new Date(),start,end;if(el.dataset.preset==='month'){var m=rpMonthRange(0);start=m.start;end=m.end;}else if(el.dataset.preset==='lastMonth'){var lm=rpMonthRange(-1);start=lm.start;end=lm.end;}else{var days=Number(el.dataset.days)||0,endDate=now,startDate=new Date(now.getFullYear(),now.getMonth(),now.getDate()-days);start=rpDateKey(startDate);end=rpDateKey(endDate);}rpEl('rp-start').value=start;rpEl('rp-end').value=end;rpSchedule();}
function rpBind(){
  if(RP.bound)return;RP.bound=true;var saved=rpReadFilter();
  ['rp-group','rp-model','rp-start','rp-end'].forEach(function(id){rpEl(id).onchange=function(){RP.pendingFilter=null;rpSchedule();};});
  document.querySelectorAll('.rp-tab').forEach(function(el){el.onclick=function(){RP.view=el.dataset.rpView;try{localStorage.setItem(RP_VIEW_KEY,RP.view);}catch(e){}rpRender();};});
  document.querySelectorAll('.rp-preset').forEach(function(el){el.onclick=function(){rpSetPreset(el);};});
  rpEl('rp-clear').onclick=function(){rpApplyFilter(rpDefaultFilter());rpSchedule();};rpEl('rp-refresh').onclick=function(){rpLoad(true);};rpEl('rp-drawer-close').onclick=rpCloseDrawer;rpEl('rp-drawer-shade').onclick=rpCloseDrawer;
  try{var view=localStorage.getItem(RP_VIEW_KEY),productMode=localStorage.getItem(RP_PRODUCT_KEY),productLayout=localStorage.getItem(RP_PRODUCT_LAYOUT_KEY);if(['overview','actions','products','analysis'].indexOf(view)>-1)RP.view=view;if(PRODUCT_MODE[productMode])RP.productMode=productMode;if(['models','all'].indexOf(productLayout)>-1)RP.productLayout=productLayout;}catch(e){}
  rpApplyFilter(saved);
  RP.refreshTimer=setInterval(function(){var page=rpEl('pg-report');if(page&&page.classList.contains('on')&&!RP.loading)rpLoad(false);},60000);
}
window.reportOpen=function(){rpBind();if(!RP.loaded)rpLoad(false);else rpSetSync('ok','อัปเดตล่าสุด '+RP.data.generatedAt);};
window.reportMarkStale=function(){RP.loaded=false;var page=rpEl('pg-report');if(page&&page.classList.contains('on'))setTimeout(function(){rpLoad(true);},250);};
})();
</script>
